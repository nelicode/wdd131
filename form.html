<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review form for users to submit feedback on technology products.">
    <meta name="author" content="Nelida Colque">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form method="get" action="review.html" id="reviewForm" class="pink-box">
            <!-- PRODUCT NAME -->
            <label for="productName"><strong>Product Name:</strong></label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product...</option>
            </select>

            <!-- OVERALL RATING -->
            <fieldset class="rating-group">
                <legend><strong>Overall Rating:</strong></legend>
                <label for="rating1">
                    <input type="radio" id="rating1" name="rating" value="1" required> ⭐
                </label>
                <label for="rating2">
                    <input type="radio" id="rating2" name="rating" value="2" required> ⭐⭐
                </label>
                <label for="rating3">
                    <input type="radio" id="rating3" name="rating" value="3" required> ⭐⭐⭐
                </label>
                <label for="rating4">
                    <input type="radio" id="rating4" name="rating" value="4" required> ⭐⭐⭐⭐
                </label>
                <label for="rating5">
                    <input type="radio" id="rating5" name="rating" value="5" required> ⭐⭐⭐⭐⭐
                </label>
            </fieldset>

            <!-- DATE OF INSTALLATION -->
            <label for="installDate"><strong>Date of Installation:</strong></label>
            <input type="date" id="installDate" name="installDate" required>

            <!-- USEFUL FEATURES -->
            <fieldset class="features-group">
                <legend><strong>Useful Features (check all that apply):</strong></legend>
                <ul class="features-list">
                    <li><label for="feature1"><input type="checkbox" id="feature1" name="features" value="durability">
                            Durability</label></li>
                    <li><label for="feature2"><input type="checkbox" id="feature2" name="features" value="design">
                            Design</label></li>
                    <li><label for="feature3"><input type="checkbox" id="feature3" name="features" value="ease"> Ease of
                            Use</label></li>
                    <li><label for="feature4"><input type="checkbox" id="feature4" name="features"
                                value="affordability"> Affordability</label></li>
                    <li><label for="feature5"><input type="checkbox" id="feature5" name="features" value="performance">
                            Performance</label></li>
                </ul>
            </fieldset>

            <!-- WRITTEN REVIEW -->
            <label for="reviewText"><strong>Written Review:</strong></label>
            <textarea id="reviewText" name="reviewText" rows="4" placeholder="Write your review here..."></textarea>

            <!-- YOUR NAME -->
            <label for="userName"><strong>Your Name:</strong></label>
            <input type="text" id="userName" name="userName" placeholder="Your name...">

            <!-- SUBMIT -->
            <input type="submit" value="Submit Review">
        </form>
    </main>

    <footer>
        <p>© 2026 Nelida Colque Salas | Arequipa</p>
        <p>Last Modification: <span id="footerDate"></span></p>
    </footer>
</body>

</html>
