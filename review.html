<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Confirmation</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="js/review.js" defer></script>
</head>

<body>
    <header>
        <h1>Review Confirmation</h1>
    </header>

    <main>
        <div class="confirmation-box">
            <h2>Thank You for Your Review!</h2>
            <p>Your feedback helps us improve our products.</p>
            <p>You have submitted <span id="reviewCount">0</span> reviews so far.</p>
        </div>
        <a href="form.html" class="back-link">← Write another review</a>
    </main>

    <footer>
        <p>© 2026 [Tu Nombre] | All rights reserved</p>
        <p>Last Modification: <span id="footerDate"></span></p>
    </footer>

    <script>
        const now = new Date();
        const formatted = now.getFullYear() + '-' +
            String(now.getMonth() + 1).padStart(2, '0') + '-' +
            String(now.getDate()).padStart(2, '0') + ' ' +
            String(now.getHours()).padStart(2, '0') + ':' +
            String(now.getMinutes()).padStart(2, '0') + ':' +
            String(now.getSeconds()).padStart(2, '0');
        document.getElementById('footerDate').textContent = formatted;
    </script>
</body>

</html>
